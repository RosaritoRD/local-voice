# Local Voice: the studio runs at http://localhost:8090 (only on your machine).
# First run: ./descargar-modelos.sh
services:
  voz-studio:
    build: .
    container_name: voz-studio
    environment:
      VOZ_MODELS: /models
      VOZ_SALIDA: /salida
      OMP_NUM_THREADS: "2"          # equal to your CPU count; more threads just fight each other
    volumes:
      - ./models:/models:ro
      - ./salida:/salida
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 2g
    restart: unless-stopped

# Want to use it from your phone or from outside? DON'T just open the port: put a
# login in front of it. Example with oauth2-proxy + Google in docs/login-access.md.
