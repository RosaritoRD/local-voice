# Voz local: el estudio queda en http://localhost:8090 (solo en tu máquina).
# Antes: ./descargar-modelos.sh
services:
  voz-studio:
    build: .
    container_name: voz-studio
    environment:
      VOZ_MODELS: /models
      VOZ_SALIDA: /salida
      OMP_NUM_THREADS: "2"          # igual al número de CPUs; más hilos solo pelean
    volumes:
      - ./models:/models:ro
      - ./salida:/salida
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 2g
    restart: unless-stopped

# ¿Quieres usarlo desde el móvil o desde fuera? NO abras el puerto tal cual: ponle
# delante un login. Ejemplo con oauth2-proxy + Google en docs/acceso-con-login.md.
